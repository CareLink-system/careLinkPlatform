apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: carelink
  labels:
    app: patient-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: dinildulneth/patient-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          env:
            # ============================================
            # DATABASE ENV VARS (ALL OF THEM!)
            # ============================================
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_USERNAME
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: PATIENT_DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: PostgresPassword
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_SSL_MODE

            # ============================================
            # JWT ENV VARS
            # ============================================
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: JWT_KEY
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_AUDIENCE

            # ============================================
            # CONNECTION STRING (FOR SERVICES THAT USE IT)
            # ============================================
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: AuthDb__ConnectionString
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: PatientDb__ConnectionString
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: carelink
spec:
  selector:
    app: patient-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP
