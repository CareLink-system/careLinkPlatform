apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: carelink
  labels:
    app: appointment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: appointment-service
          image: dinildulneth/appointment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
              name: http
          env:
            - name: BASE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: BASE_SERVICE_URL

            # ============================================
            # DATABASE ENV VARS (ALL OF THEM!)
            # ============================================
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_USERNAME
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: APPOINTMENT_DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: PostgresPassword
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_SSL_MODE

            # ============================================
            # JWT ENV VARS
            # ============================================
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: JWT_KEY
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_AUDIENCE

            # ============================================
            # CONNECTION STRING (FOR SERVICES THAT USE IT)
            # ============================================
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: AuthDb__ConnectionString
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: AppointmentDb__ConnectionString
            - name: BASE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_ISSUER
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: carelink
spec:
  selector:
    app: appointment-service
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP
