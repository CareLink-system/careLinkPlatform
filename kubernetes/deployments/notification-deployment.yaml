apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: carelink
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5008"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: notification-service
          image: dinildulneth/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5008
              name: http
          env:
            # ============================================
            # DATABASE ENV VARS (ALL OF THEM!)
            # ============================================
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_USERNAME
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: NOTIFICATION_DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: PostgresPassword
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_SSL_MODE

            # ============================================
            # JWT ENV VARS
            # ============================================
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: JWT_KEY
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_AUDIENCE

            # ============================================
            # CONNECTION STRING (FOR SERVICES THAT USE IT)
            # ============================================
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: AuthDb__ConnectionString
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: MongoDb__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: MongoDb__ConnectionString
            - name: MongoDb__Database
              value: notificationdb
            # - name: RabbitMq__Host
            #   valueFrom:
            #     configMapKeyRef:
            #       name: carelink-config
            #       key: RabbitMq__Host
            # - name: RabbitMq__Username
            #   value: guest
            # - name: RabbitMq__Password
            #   valueFrom:
            #     secretKeyRef:
            #       name: carelink-secrets
            #       key: RabbitMq__Password
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: carelink
spec:
  selector:
    app: notification-service
  ports:
    - port: 5008
      targetPort: 5008
  type: ClusterIP
