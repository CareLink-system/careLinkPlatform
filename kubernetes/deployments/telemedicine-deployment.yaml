apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: carelink
  labels:
    app: telemedicine-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
        - name: telemedicine-service
          image: dinildulneth/telemedicine-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5007
              name: http
          env:
            # ============================================
            # DATABASE ENV VARS (ALL OF THEM!)
            # ============================================
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_USERNAME
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: TELEMEDICINE_DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: PostgresPassword
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: DB_SSL_MODE

            # ============================================
            # JWT ENV VARS
            # ============================================
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: JWT_KEY
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: JWT_AUDIENCE

            # ============================================
            # CONNECTION STRING (FOR SERVICES THAT USE IT)
            # ============================================
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: AuthDb__ConnectionString
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: MongoDb__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: carelink-config
                  key: MongoDb__ConnectionString
            - name: MongoDb__Database
              value: telemedicinedb
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-service
  namespace: carelink
spec:
  selector:
    app: telemedicine-service
  ports:
    - port: 5007
      targetPort: 5007
  type: ClusterIP
